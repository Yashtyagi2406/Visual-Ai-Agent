version: '3.9'

# ------------------------------------------------------------------
# NeoFlo Visual Agent — Local Development Stack
# Run:  docker compose up -d
# Stop: docker compose down
# ------------------------------------------------------------------

services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neoflo
      POSTGRES_PASSWORD: neoflo_secret
      POSTGRES_DB: neoflo_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neoflo -d neoflo_agent']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Express API server ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://neoflo:neoflo_secret@postgres:5432/neoflo_agent
      REDIS_URL: redis://redis:6379
      PORT: 3000
      BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: local
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend_uploads:/app/uploads
    command: >
      sh -c "npx prisma migrate deploy && npm run dev"

  # ── BullMQ Vision Worker ──────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://neoflo:neoflo_secret@postgres:5432/neoflo_agent
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: local
    volumes:
      - ./backend/src:/app/src
      - backend_uploads:/app/uploads
    command: npm run worker

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
